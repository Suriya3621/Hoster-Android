appId: com.hoster.app
productName: Hoster
copyright: Hoster
directories:
  app: stage          # created by scripts/stage.js (server + built web UI + main.js)
  output: ../release
  buildResources: build
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hoster
  artifactName: Hoster-Setup-${version}.${ext}
portable:
  artifactName: Hoster-Portable-${version}.${ext}
